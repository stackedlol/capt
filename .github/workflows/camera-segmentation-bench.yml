name: Scratch camera segmentation bench
on:
  push:
    branches: [ci/camera-segmentation-bench]
jobs:
  macos:
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: aarch64-apple-darwin
          prefix-key: v1-rust-gpui-macos26-scratch
          save-cache: "true"
          workspaces: apps/desktop-gpui -> target
      - name: Setup
        shell: bash
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: aarch64-apple-darwin
      - name: Prepare GPUI dependency
        shell: bash
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - name: Build bench binary
        shell: bash
        run: |
          set +e
          exe=$(cargo +1.95.0 test --manifest-path apps/desktop-gpui/Cargo.toml --locked --target aarch64-apple-darwin \
            --config 'profile.dev.package.cap-desktop-gpui.opt-level=2' --bin cap-gpui --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable' | tail -1)
          echo "exe=$exe"
          mkdir -p "$RUNNER_TEMP/bench/Frameworks"
          cp "$exe" "$RUNNER_TEMP/bench/cap-gpui-tests"
          cp -R "$GITHUB_WORKSPACE/target/Frameworks/Spacedrive.framework" "$RUNNER_TEMP/bench/Frameworks/"
          otool -L "$exe" | head -40
          otool -l "$exe" | grep -A2 LC_RPATH
          ls -la "$RUNNER_TEMP/bench"
      - uses: actions/upload-artifact@v4
        with:
          name: camera-segmentation-bench
          path: ${{ runner.temp }}/bench
          retention-days: 3
